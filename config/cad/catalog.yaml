# CAD model catalog configuration.
# Asset files live under assets/cad_models/ (not versioned).

catalog:
  root: assets/cad_models
  index: models/cad_index.faiss
  metadata: models/cad_metadata.json
  descriptor_dim: 256

retrieval:
  top_k: 5
  min_score: 0.65
  descriptor: pointnet2  # pointnet2 | dgcnn | fpfh
  alignment:
    method: icp  # icp | procrustes | hybrid
    max_iterations: 50
    max_correspondence_distance_m: 0.05
    convergence_threshold: 1.0e-6

categories:
  pump:
    models:
      - id: pump_centrifugal_01
        file: pump/centrifugal_01.glb
        manufacturer: generic
        scale: 1.0
      - id: pump_hydraulic_01
        file: pump/hydraulic_01.glb
        manufacturer: generic
        scale: 1.0

  motor:
